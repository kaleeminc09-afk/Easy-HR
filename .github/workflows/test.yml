name: Easy HR tests

# The test bot: runs the Jest suite on every push and pull request.
# If a change breaks the bot's core logic (hours math, task matching,
# geofence distance, anomaly flags), this goes red before it reaches the app.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: mobile
        run: npm install
      - name: Run tests
        working-directory: mobile
        run: npm test
